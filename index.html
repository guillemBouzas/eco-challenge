<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniChallenge - EcoMamaria Sim</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ffcc;
            font-family: monospace, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        #monitor {
            width: 90vw;
            max-width: 400px;
            height: 450px;
            border: 4px solid #333;
            border-radius: 12px;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            text-align: left;
            pointer-events: none;
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,255,204,0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <h2>ECO-CHALLENGE MAMA</h2>
    
    <div id="monitor">
        <div class="ui-overlay">
            MODE: POCUS<br>
            GAIN: 55dB<br>
            PROF: 4.5cm<br>
            <span id="slice-text">Corte: Superficial</span>
        </div>
        <canvas id="ecoCanvas" width="400" height="450"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn">Activar Sonda (Giroscopio)</button>
        <div id="status">Pulsa el botón para calibrar sensores</div>
    </div>

    <script>
        const canvas = document.getElementById('ecoCanvas');
        const ctx = canvas.getContext('2d');
        const sliceText = document.getElementById('slice-text');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        let currentSlice = 1; // De 1 a 5
        let baseBeta = null;   // Ángulo de calibración inicial

        // Dibujar la ecografía simulada según la "capa" actual
        function drawUltrasound(slice) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo con textura de ultrasonido (ruido grisáceo)
            ctx.fillStyle = '#0a0f0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Simular tejido graso (líneas horizontales difusas)
            ctx.strokeStyle = 'rgba(20, 50, 40, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.height; i += 15) {
                ctx.beginPath();
                ctx.moveTo(0, i + (slice * 3));
                ctx.lineTo(canvas.width, i + (slice * 3));
                ctx.stroke();
            }

            // Renderizado dinámico según el corte de profundidad
            if (slice === 1) {
                sliceText.innerText = "Corte: Piel y tejido subcutáneo";
                // Solo grasa superficial hipoecogénica
            } else if (slice === 2) {
                sliceText.innerText = "Corte: Parénquima mamario normal";
                // Pequeños conductos galactóforos
                ctx.strokeStyle = 'rgba(100, 150, 130, 0.3)';
                ctx.beginPath();
                ctx.arc(200, 220, 60, 0, Math.PI * 2);
                ctx.stroke();
            } else if (slice === 3 || slice === 4) {
                sliceText.innerText = "¡HALLAZGO DETECTADO! (Zona sospechosa)";
                
                // Dibujar lesión sospechosa (Nódulo hipoecoico irregular con sombra acústica)
                // Sombra acústica posterior (cono negro debajo)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.moveTo(170, 250);
                ctx.lineTo(130, 450);
                ctx.lineTo(270, 450);
                ctx.lineTo(230, 250);
                ctx.closePath();
                ctx.fill();

                // Nódulo con bordes espiculados
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(200, 225, slice === 3 ? 35 : 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Texto de alerta clínico en pantalla
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 14px monospace';
                ctx.fillText("BI-RADS 4: Nódulo irregular", 90, 60);
            } else {
                sliceText.innerText = "Corte: Plano profundo / Muscular";
                // Línea del músculo pectoral al fondo
                ctx.fillStyle = '#33443b';
                ctx.fillRect(0, 380, canvas.width, 70);
                ctx.fillStyle = '#00ffcc';
                ctx.font = '12px monospace';
                ctx.fillText("Fascia Pectoral", 150, 400);
            }
        }

        // Manejo de permisos y eventos de orientación en móviles
        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ requiere permiso explícito
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            statusDiv.innerText = "Sonda activa. Inclina el móvil.";
                            startBtn.style.display = 'none';
                        } else {
                            alert("Permiso denegado para los sensores.");
                        }
                    }).catch(console.error);
            } else {
                // Android y otros navegadores compatibles por defecto
                window.addEventListener('deviceorientation', handleOrientation);
                statusDiv.innerText = "Sonda activa. Inclina el móvil.";
                startBtn.style.display = 'none';
            }
        }

        function handleOrientation(event) {
            let beta = event.beta; // Inclinación frontal (-180 a 180)
            
            if (baseBeta === null && beta !== null) {
                baseBeta = beta; // Calibrar posición inicial al pulsar
            }

            if (beta !== null && baseBeta !== null) {
                // Calcular diferencia respecto a la posición inicial
                let diff = beta - baseBeta;
                
                // Mapear el rango de inclinación (-30 a +30 grados) a 5 cortes ecográficos
                if (diff < -15) currentSlice = 1;
                else if (diff >= -15 && diff < -5) currentSlice = 2;
                else if (diff >= -5 && diff < 5) currentSlice = 3;
                else if (diff >= 5 && diff < 15) currentSlice = 4;
                else currentSlice = 5;

                drawUltrasound(currentSlice);
            }
        }

        startBtn.addEventListener('click', initSensors);
        
        // Render inicial por defecto
        drawUltrasound(currentSlice);
    </script>
</body>
</html>
